<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Like & View Page</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 3rem;
      text-shadow: 0 0 10px #0ff;
    }
    .box {
      margin-top: 2rem;
      padding: 2rem;
      border: 2px solid #0ff;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 20px #0ff;
    }
    .stats {
      margin-top: 1rem;
      font-size: 1.5rem;
    }
    .like-btn {
      font-size: 1.5rem;
      background: none;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    .like-btn:hover {
      background: #0ff;
      color: #000;
    }
  </style>
</head>
<body>
  <h1>Welcome!</h1>
  <div class="box">
    <div class="stats">
      👁️ Views: <span id="viewCount">0</span><br />
      ❤️ Likes: <span id="likeCount">0</span>
    </div>
    <button class="like-btn" id="likeBtn">👍 Like</button>
  </div>

  <script>
    const domainKey = 'simple-like-view-page'; // Change if reusing for other pages

    // ======== VIEW COUNT ========
    fetch('https://visitor.6developer.com/visit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ domain: domainKey + '-views' })
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById('viewCount').innerText = data.totalCount;
    });

    // ======== LIKE COUNT ========
    const likeKey = 'liked-' + domainKey;
    const hasLiked = localStorage.getItem(likeKey) === '1';

    // Get current like count
    fetch(`https://visitor.6developer.com/visit?domain=${domainKey}-likes`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('likeCount').innerText = data.totalCount;
        if (hasLiked) {
          document.getElementById('likeBtn').innerText = '💖 Liked';
        }
      });

    // Handle like button click
    document.getElementById('likeBtn').addEventListener('click', () => {
      if (!hasLiked) {
        localStorage.setItem(likeKey, '1');
        fetch('https://visitor.6developer.com/visit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ domain: domainKey + '-likes' })
        })
        .then(res => res.json())
        .then(data => {
          document.getElementById('likeCount').innerText = data.totalCount;
          document.getElementById('likeBtn').innerText = '💖 Liked';
        });
      }
    });
  </script>
</body>
</html>
